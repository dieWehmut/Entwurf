[workspace]
resolver = "2"
members = [
    "crates/entwurf-automation",
    "crates/entwurf-core",
    "crates/entwurf-cli",
    "crates/entwurf-web",
    "crates/entwurf-wasm",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/dieWehmut/Entwurf"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
resvg = "0.49"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tiny-skia = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
