<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entwurf · ChatGPT 连接</title><link rel="stylesheet" href="options.css"></head>
<body><main><h1>连接 Entwurf</h1><p>打开本机 Entwurf 服务，在连接设置中复制扩展配对信息。保留当前浏览器中已登录的 ChatGPT 标签页。</p>
