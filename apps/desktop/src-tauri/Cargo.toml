[package]
name = "entwurf-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Entwurf Tauri desktop shell"

[lib]
name = "entwurf_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
entwurf-core = { path = "../../../crates/entwurf-core" }
entwurf-web = { path = "../../../crates/entwurf-web" }
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1"] }
tokio = { version = "1", features = ["io-util", "time", "net", "process", "rt", "macros", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(windows)'.dependencies]
getrandom = "0.3"
