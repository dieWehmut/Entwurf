[package]
name = "entwurf-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local-first knowledge illustration compiler for Entwurf"

[features]
default = ["native"]
native = ["dep:rusqlite", "dep:tempfile", "dep:pdfium-render", "dep:walkdir", "resvg/default"]
browser = ["uuid/js", "dep:getrandom"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
jsonschema = { version = "0.33", default-features = false }
rusqlite = { version = "0.38", features = ["bundled"], optional = true }
tempfile = { workspace = true, optional = true }
regex.workspace = true
resvg = { version = "0.49", default-features = false, features = ["raster-images"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tiny-skia.workspace = true
uuid.workspace = true
walkdir = { workspace = true, optional = true }
pulldown-cmark = "0.13"
pdfium-render = { version = "=0.9.4", optional = true, default-features = false, features = ["pdfium_7881", "thread_safe", "image_025"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "webp"] }

typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-svg = "=0.15.1"
typst-pdf = "=0.15.1"
typst-assets = {version = "=0.15.1", features = ["fonts"]}
mitex = "=0.2.4"
png = "=0.18.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"], optional = true }
