[package]
name = "entwurf-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local Entwurf WebUI and paired ChatGPT workflow coordinator"

[dependencies]
entwurf-core = { path = "../entwurf-core" }
entwurf-automation = { path = "../entwurf-automation" }
axum = { version = "0.8.9", features = ["multipart", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "process"] }
tower-http = { version = "0.6", features = ["fs"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
sha2.workspace = true
base64 = "0.22"
futures-util = "0.3"

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
